[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wealthsim"
version = "0.1.0"
description = "Unofficial Python client for Wealthsimple: quotes, accounts, positions, activity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eugene Wang" }]
keywords = ["wealthsimple", "trading", "investing", "finance", "api", "canada", "brokerage", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
]
dependencies = ["curl_cffi>=0.7"]

[project.optional-dependencies]
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/eugland/wealthsim"
Source = "https://github.com/eugland/wealthsim"

[tool.hatch.build.targets.wheel]
packages = ["wealthsim"]
